name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch Token Monitor packager
        run: |
          git clone --depth 1 --branch v0.87.0 https://github.com/Javis603/token-monitor.git /tmp/token-monitor
          cd /tmp/token-monitor
          npm ci --omit=dev --no-audit --no-fund
      - name: Build package
        run: TM_REPO=/tmp/token-monitor npm run build -- --force
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # dist keeps older packages for catalog history; a release only ships
          # the package built from this tag.
          gh release create "$TAG" "dist/wakatime-sync-${VERSION}.tmplugin" --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"

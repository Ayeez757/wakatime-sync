name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch Token Monitor packager
        run: |
          git clone --depth 1 --branch v0.87.0 https://github.com/Javis603/token-monitor.git /tmp/token-monitor
      - name: Build package
        run: TM_REPO=/tmp/token-monitor npm run build
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" dist/*.tmplugin --title "$TAG" --generate-notes --repo "$GITHUB_REPOSITORY"
